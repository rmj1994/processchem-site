  <section class="band cut-both s" id="companies">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="eyebrow">{{companies.eyebrow}}</p>
        <h2>{{companies.h2}}</h2>
        <p>{{companies.p}}</p>
      </div>
      <div class="demo reveal">
        <div class="phone-col"><div class="app p-std" id="demoPhone" aria-label="Illustrative app screen"></div></div>
        <div>
          <div class="seg" role="group" aria-label="Choose an example company">
            <button type="button" aria-pressed="true" data-k="std">Standard app</button>
            <button type="button" aria-pressed="false" data-k="acme">Acme Process Co.</button>
            <button type="button" aria-pressed="false" data-k="nw">Northwind Chemicals</button>
          </div>
          <p class="fict">{{companies.fict}}</p>
          <dl id="facts"></dl>
          <p class="after">{{companies.after}}</p>
          <div class="cta"><a class="btn fill" href="mailto:ronmjacob1994@gmail.com"><small>{{companies.cta_small}}</small>{{companies.cta}}</a></div>
        </div>
      </div>
    </div>
  </section>

<script>
(function () {
  var ICON = document.querySelector(".brand img").src;
  var PROFILES = {
    std: {
      cls: "p-std", name: "ProcessChem", mark: null,
      tabs: ["Property", "Thermo", "Case", "Units"],
      cases: ["Heater", "Vessel Heater", "Fluidized Bed", "Heat Exchanger"],
      units: ["bara", "°C", "Normal 20 °C"],
      saved: [],
      look: "ProcessChem blue and icon",
      facts: {
        Tabs: "Property, Thermo, Case, Units",
        Cases: "All four, standard order",
        Units: "bara, °C, Normal at 20 °C",
        "Saved cases": "None",
        Look: "ProcessChem blue and icon"
      }
    },
    acme: {
      cls: "p-acme", name: "Acme Process Co.", mark: "A",
      tabs: ["Case", "Property", "Units"],
      cases: ["Heat Exchanger", "Heater"],
      units: ["psia", "°F", "SCFM"],
      saved: ["Syngas preheater", "Feed cooler"],
      facts: {
        Tabs: "Case first, then Property and Units. Thermo hidden",
        Cases: "Heat Exchanger, Heater",
        Units: "psia, °F, SCFM",
        "Saved cases": "Syngas preheater, Feed cooler",
        Look: "Acme name, initial and red-orange accent"
      }
    },
    nw: {
      cls: "p-nw", name: "Northwind Chemicals", mark: "N",
      tabs: ["Case", "Thermo", "Property", "Units"],
      cases: ["Fluidized Bed", "Vessel Heater", "Heater"],
      units: ["bara", "°C", "Nm³/h at 0 °C"],
      saved: ["Dryer bed baseline", "Surge vessel heat-up"],
      facts: {
        Tabs: "Case, Thermo, Property, Units",
        Cases: "Fluidized Bed, Vessel Heater, Heater",
        Units: "bara, °C, Nm³/h at 0 °C",
        "Saved cases": "Dryer bed baseline, Surge vessel heat-up",
        Look: "Northwind name, initial and amber accent"
      }
    }
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var ICONS = {
    Property: '<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>',
    Thermo: '<svg viewBox="0 0 24 24"><path d="M12 3a2 2 0 0 0-2 2v8a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2z"/></svg>',
    Case: '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 11h6M9 15h6"/></svg>',
    Units: '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg>'
  };

  // The Case screen's cards, worded as in the app.
  var CASES = {
    "Heater": ["Heat or cool a flowing stream: find the duty or the outlet temperature",
      '<svg viewBox="0 0 24 24"><path d="M4 12h2l2-5 3 10 3-10 3 10 2-5h1"/></svg>'],
    "Vessel Heater": ["Heat a batch in a vessel: the energy to reach a temperature",
      '<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="4"/><path d="M6 13h12"/></svg>'],
    "Fluidized Bed": ["Fluidization window, pressure drop, freeboard and reaction",
      '<svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="2.5"/><circle cx="15.5" cy="13" r="2.5"/><circle cx="9" cy="17" r="2"/><circle cx="16" cy="6" r="1.6"/></svg>'],
    "Heat Exchanger": ["Two streams, one duty: outlet temperatures and approach",
      '<svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>']
  };
  var CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

  function phoneHtml(p) {
    var company = p.mark ? '<div class="co"><span class="mark">' + esc(p.mark) + '</span><b>' + esc(p.name) + '</b></div>' : '';
    var tabs = p.tabs.map(function (t) {
      return '<span class="' + (t === "Case" ? "on" : "") + '"><i>' + ICONS[t] + '</i>' + esc(t) + '</span>';
    }).join("");
    var cards = p.cases.map(function (c) {
      return '<div class="card"><i>' + CASES[c][1] + '</i><div><b>' + esc(c) + '</b><small>' + esc(CASES[c][0]) + '</small></div>' + CHEV + '</div>';
    }).join("");
    var chips = p.mark ? '<div class="lab">Default units</div><div class="chips">' + p.units.map(function (u) { return '<span class="chip">' + esc(u) + '</span>'; }).join("") + '</div>' : '';
    var saved = p.saved.length
      ? '<div class="lab">Saved by your company</div><div class="saved">' + p.saved.map(function (s) { return '<div><i></i>' + esc(s) + '</div>'; }).join("") + '</div>'
      : '';
    return '<div class="tag-ex">example</div><div class="body">' +
      '<div class="hd"><b>Case</b><span class="docs">Docs ↗</span><span class="more">⋯</span></div>' +
      '<div class="sub">Real-world scenarios, start to finish</div>' + company +
      '<div class="lab">All cases</div>' + cards + chips + saved + '</div>' +
      '<div class="nav">' + tabs + '</div>';
  }

  function paint(el, key) {
    var p = PROFILES[key];
    el.className = "app " + p.cls;
    el.innerHTML = phoneHtml(p);
  }

  function facts(key) {
    var f = PROFILES[key].facts, out = "";
    Object.keys(f).forEach(function (k) { out += '<div><dt>' + esc(k) + '</dt><dd>' + esc(f[k]) + '</dd></div>'; });
    document.getElementById("facts").innerHTML = out;
  }

  paint(document.getElementById("demoPhone"), "std");
  facts("std");

  var buttons = document.querySelectorAll(".seg button");
  Array.prototype.forEach.call(buttons, function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(buttons, function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      paint(document.getElementById("demoPhone"), b.getAttribute("data-k"));
      facts(b.getAttribute("data-k"));
    });
  });
})();
</script>
